<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard KPI - Web3 Security Command Center</title>
    <!-- Tailwind & Chart.js CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
        .font-cyber { font-family: 'Orbitron', sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(6, 182, 212, 0.2); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .neon-cyan-glow { text-shadow: 0 0 10px rgba(6, 182, 212, 0.7); }
        .neon-border-cyan { box-shadow: 0 0 15px rgba(6, 182, 212, 0.15); }
    </style>
</head>
<body class="min-h-screen relative p-6">
    <div class="max-w-7xl mx-auto">
        <header class="glass-card rounded-2xl p-6 mb-8 flex justify-between items-center">
            <h1 class="font-cyber text-2xl font-extrabold text-cyan-400">CYBERGUARD // KPI COMMAND CENTER</h1>
            <span id="syncStatus" class="text-xs text-yellow-400">Menghubungkan ke API...</span>
        </header>

        <!-- Tabel Monitoring -->
        <div class="glass-card rounded-2xl p-6 overflow-hidden">
            <table class="w-full text-left text-xs text-gray-300">
                <thead class="bg-gray-900 text-cyan-400 uppercase">
                    <tr>
                        <th class="py-3 px-3">Rank</th>
                        <th class="py-3 px-3">Nama</th>
                        <th class="py-3 px-3">Shift</th>
                        <th class="py-3 px-3 text-right">Total Skor</th>
                    </tr>
                </thead>
                <tbody id="tableBodyKPI">
                    <tr><td colspan="4" class="text-center py-4">Memuat data dari Google Apps Script API...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 🔗 MASUKKAN URL HASIL DEPLOY GOOGLE APPS SCRIPT ANDA DI SINI
        const API_URL = "MASUKKAN_WEB_APP_URL_ANDA_DISINI";

        window.onload = function() {
            fetchDataFromAppsScript();
        };

        function fetchDataFromAppsScript() {
            fetch(API_URL + "?action=getKPI")
                .then(response => response.json())
                .then(result => {
                    if (result.status === "success") {
                        document.getElementById('syncStatus').textContent = "● Live Connected (API)";
                        document.getElementById('syncStatus').className = "text-xs text-emerald-400";
                        renderTable(result.data);
                    } else {
                        alert("Gagal memuat data: " + result.message);
                    }
                })
                .catch(err => {
                    console.error("API Error:", err);
                    document.getElementById('syncStatus').textContent = "● Koneksi Gagal";
                    document.getElementById('syncStatus').className = "text-xs text-red-500";
                });
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBodyKPI');
            tbody.innerHTML = '';
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-800 hover:bg-cyan-500/5";
                tr.innerHTML = `
                    <td class="py-3 px-3 font-bold text-cyan-300">#${row.peringkat}</td>
                    <td class="py-3 px-3 font-semibold text-white">${row.nama}</td>
                    <td class="py-3 px-3 text-purple-300">${row.shift}</td>
                    <td class="py-3 px-3 text-right font-bold text-cyan-400">${row.totalSkor}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
